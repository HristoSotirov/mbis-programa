<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разпис МБИС · ТУ-София</title>
<meta name="description" content="Удобен седмичен разпис за специалност МБИС, ТУ-София — зимен семестър 2026/2027.">
<meta name="theme-color" content="#0f2a52">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark">ТУ</span>
        <div class="brand-text">
          <strong>Разпис МБИС</strong>
          <span id="semesterLabel">Зимен семестър 2026/2027</span>
        </div>
      </div>

      <button id="menuToggle" class="icon-btn only-mobile" aria-label="Настройки" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="controls" id="controlsPanel">
      <label class="field">
        <span>Група</span>
        <select id="groupSelect"></select>
      </label>

      <label class="field checkbox-field">
        <input type="checkbox" id="showAllCheckbox">
        <span>Покажи всички групи</span>
      </label>

      <div class="field view-toggle" role="group" aria-label="Изглед">
        <button class="toggle-btn active" data-view="week" type="button">Седмица</button>
        <button class="toggle-btn" data-view="agenda" type="button">Списък</button>
      </div>
    </div>
  </header>

  <nav class="week-nav">
    <button id="prevWeek" class="nav-btn" aria-label="Предишна седмица">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="week-label">
      <strong id="weekTitle">Седмица 1</strong>
      <span id="weekRange">05–10.10.2026</span>
    </div>
    <button id="nextWeek" class="nav-btn" aria-label="Следваща седмица">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="todayBtn" class="today-btn" type="button">Днес</button>
  </nav>

  <main id="viewRoot" class="view-root">
    <!-- rendered by app.js -->
  </main>

  <footer class="app-footer">
    <p id="footerNote">Зарежда…</p>
    <p class="disclaimer">Неофициален изглед на публичния разпис на ТУ-София (специалност МБИС). При разминаване, официалният файл на tu-sofia.bg е меродавен. Крайните часове са пресметнати ориентировъчно (1 уч. час ≈ 45 мин.).</p>
  </footer>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
